version: "3.9"

services:
  ai-service:
    build: ./ai-service
    container_name: krishiai-ai
    ports:
      - "8000:8000"
    environment:
      - MODEL_MODE=${MODEL_MODE:-auto}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./ai-service/data:/app/data
      - ./ai-service/models_store:/app/models_store
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: krishiai-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AI_SERVICE_URL=http://ai-service:8000
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      - ai-service
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: krishiai-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
