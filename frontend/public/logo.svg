<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="krishiBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="krishiSproutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="krishiSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="krishiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#052e16" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="48" height="48" rx="12" fill="url(#krishiBgGrad)" />

  <!-- Subtle AI / Tech Circuit Accent Lines -->
  <path d="M 6 24 C 12 24, 14 32, 20 32" stroke="#86efac" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.6" />
  <path d="M 42 24 C 36 24, 34 16, 28 16" stroke="#86efac" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.6" />
  <circle cx="20" cy="32" r="1.5" fill="#86efac" opacity="0.8" />
  <circle cx="28" cy="16" r="1.5" fill="#86efac" opacity="0.8" />

  <!-- Rising Golden Sun (Warmth & Harvest) -->
  <circle cx="24" cy="17" r="5" fill="url(#krishiSunGrad)" opacity="0.95" />

  <!-- Sun Rays (Subtle AI / Knowledge Radiance) -->
  <path d="M24 9.5 V11" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
  <path d="M30 11 L28.9 12.1" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
  <path d="M18 11 L19.1 12.1" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />

  <!-- Fertile Furrow / Ground Curves -->
  <path d="M 8 38 C 16 35, 32 35, 40 38" stroke="#14532d" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
  <path d="M 12 41 C 18 39, 30 39, 36 41" stroke="#14532d" stroke-width="2" stroke-linecap="round" opacity="0.4" />

  <!-- Agriculture Sprout / Plant Growth -->
  <!-- Main Stem -->
  <path d="M24 37 C24 29 24 21 24 17" stroke="url(#krishiSproutGrad)" stroke-width="2.6" stroke-linecap="round" filter="url(#krishiGlow)" />

  <!-- Left Lush Leaf -->
  <path d="M24 28 C20 28 13 25 14 18 C20 18 23 23 24 28 Z" fill="url(#krishiSproutGrad)" filter="url(#krishiGlow)" />
  <!-- Left Leaf Vein -->
  <path d="M17 22 C19.5 22.5 22 25 24 27" stroke="#16a34a" stroke-width="0.8" stroke-linecap="round" opacity="0.7" />

  <!-- Right Sprouting Leaf (Golden-Green Agri shoot) -->
  <path d="M24 24 C27 24 34 22 34 15 C28 15 25 19 24 24 Z" fill="#bbf7d0" filter="url(#krishiGlow)" />
  <!-- Right Leaf Vein -->
  <path d="M30 18.5 C28 19.5 26 21.5 24 23" stroke="#15803d" stroke-width="0.8" stroke-linecap="round" opacity="0.7" />

  <!-- AI Sparkle / Tech Node at the apex of growth -->
  <circle cx="24" cy="17" r="1.5" fill="#ffffff" />
</svg>
